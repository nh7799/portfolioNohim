<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/nohim_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Nohim Hasitha — BSc Computer Science student seeking a UK software engineering placement in 2026. Java, Python, React, embedded systems. Full UK work rights."
    />
    <meta name="theme-color" content="#f9fafb" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("portfolio-theme");
          var dark =
            t === "dark" ||
            (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute("content", "#0f1117");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <title>Nohim Hasitha · Software Engineering Placement 2026</title>
  </head>
  <body class="bg-background text-text antialiased">

  </body>
</html>
